<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>直前オッズ観測</title><link rel="stylesheet" href="style.css"><body><main><header><span class="eyebrow">ODDS OBSERVER / LIVE WINDOW</span><h1>締切までの、動きを見る。</h1><p>発売締切5分前からの単勝・複勝。受信できた変化だけを表示します。</p></header><section class="status"><div><span id="mode">接続待ち</span><h2 id="race">収集データを待っています</h2><p id="times">コレクターを起動すると自動更新します。</p></div><div class="count"><small>発売締切まで</small><strong id="count">—</strong></div></section><nav><button data-market="win" aria-pressed="true">単勝</button><button data-market="place" aria-pressed="false">複勝</button><label id="endpoint-wrap" hidden>比較する値 <select id="endpoint"><option value="low">下限</option><option value="high">上限</option></select></label></nav><p id="quality" role="status"></p><div class="table-wrap"><table><thead><tr><th>馬番</th><th>最新オッズ</th><th>5分間の推移</th><th>最大下落</th><th>最大上昇</th><th>最大下落を観測した時刻</th></tr></thead><tbody id="rows"></tbody></table></div><p class="foot">線の横軸は受信時刻。欠損・取消をまたぐ変動は計算しません。発表時刻は分精度です。表示の更新と元データの更新は異なります。</p></main><script type="module" src="app.js"></script></body></html>

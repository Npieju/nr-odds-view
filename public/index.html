<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>直前オッズ観測</title><link rel="stylesheet" href="style.css"></head>
<body><main>
<header><span class="eyebrow">ODDS OBSERVER</span><h1>直前オッズ観測</h1></header>
<nav class="page-nav" aria-label="表示ページ"><a href="#latest" id="latest-link">最新</a><a href="#history" id="history-link">履歴</a><a href="#demo" id="demo-link">模擬</a></nav>
<div id="demo-controls" hidden><button id="demo-play" type="button">再生 ×10</button><label>再生位置 <input id="demo-position" type="range" min="0" max="600" step="10" value="360"></label><output id="demo-time"></output></div>
<div id="history-controls" hidden><label>開催日 <select id="history-date"></select></label><nav id="history-venues" role="tablist" aria-label="履歴の開催場"></nav><label>レース <select id="history-race"></select></label></div>
<p id="meeting"></p><nav id="venues" role="tablist" aria-label="開催場"></nav>
<section class="status"><div><span id="mode">接続待ち</span><h2 id="race">収集データを待っています</h2><p id="times"></p></div><div class="count"><small>発売締切まで</small><strong id="count">—</strong></div></section>
<nav class="markets" aria-label="券種"><button data-market="win" aria-pressed="true">単勝</button><button data-market="place" aria-pressed="false">複勝</button><label id="endpoint-wrap" hidden>比較する値 <select id="endpoint"><option value="low">下限</option><option value="high">上限</option></select></label></nav>
<p id="quality" role="status"></p>
<div class="table-wrap" tabindex="0" aria-label="オッズ比較表。横スクロールできます"><table><thead><tr><th>馬番</th><th>馬名</th><th id="odds-heading">現在オッズ</th><th>最高値から<br>下落率</th><th>最低値から<br>上昇率</th><th id="chart-heading" class="chart-cell"><span>推移 · 締切基準</span><span id="chart-legend"></span></th></tr></thead><tbody id="rows"></tbody></table></div>
<p class="foot">各点と同じ位置に30秒ごとのオッズを表示します。倍率の目盛りは馬ごとに異なり、点線は期間の最高・最低を示します。狭い画面では表を横にスクロールできます。</p>
</main>
<script type="module" src="app.js"></script>
</body></html>

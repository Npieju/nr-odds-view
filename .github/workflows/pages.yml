name: Publish frontend to GitHub Pages

on:
  push:
    branches: [main, backend/live-final-and-cutoff]
    paths:
      - 'public/**'
      - 'src/build-public.mjs'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test
      - run: node src/build-public.mjs work/pages-dist
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: work/pages-dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
